name: Build Android APK Test Release

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java Development Kit (JDK)
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Build ARM64-v8a APK
              run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

            - name: Prepare APK Output Name
              run: |
                  cp build/app/outputs/flutter-apk/app-release.apk deepignite_calculator-v0.1.0.test.apk
            - name: Upload temporary file
              uses: actions/upload-artifact@v4
              with:
                  name: deepignite_calculator-v0.1.0.test.apk
                  path: deepignite_calculator-v0.1.0.test.apk
                  retention-days: 1 # Automatically deletes after 24 hours
